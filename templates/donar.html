<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Realizar Donación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="mb-3 text-center">Realizar Donación</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Tu Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Monto a Donar ($)</label>
                    <input type="number" name="monto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Selecciona un Beneficiario</label>
                    <select name="beneficiario" class="form-select" required>
                        {% for b in beneficiarios %}
                            <option value="{{ b }}">{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Confirmar Donación</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">♥ Donaciones Solidarias</a>

        </button>

                <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="/logout">Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>
</nav>
