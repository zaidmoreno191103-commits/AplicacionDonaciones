<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuenta - Donaciones Solidarias</title>
    <!-- Importar Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">♥ Donaciones Solidarias</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/donar">Hacer Donación</a>
                <a class="nav-link" href="/historial">Historial</a>
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link active" href="/registro">Registrarse</a>
            </div>
        </div>
    </nav>

    <!-- Contenido del Formulario de Registro -->
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow border-0 p-4">
            <h3 class="mb-3 text-center text-primary fw-bold">Crear Cuenta Nueva</h3>
            <p class="text-muted text-center mb-4">Regístrate para formar parte de nuestra comunidad solidaria.</p>
            
            <form action="/registro" method="POST">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Registrar Cuenta</button>
            </form>
            
            <div class="mt-4 text-center">
                <span class="text-muted">¿Ya tienes una cuenta?</span> <a href="/login" class="text-decoration-none fw-semibold">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
