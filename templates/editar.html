<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Donación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4 border-0">
            <h3 class="mb-3 text-center text-warning">Editar Donación #{{ donacion.id }}</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre del Donante</label>
                    <input type="text" name="nombre" class="form-control" value="{{ donacion.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Monto ($)</label>
                    <input type="number" name="monto" class="form-control" value="{{ donacion.monto }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Beneficiario</label>
                    <select name="beneficiario" class="form-select" required>
                        {% for b in beneficiarios %}
                            <option value="{{ b }}" {% if b == donacion.beneficiario %}selected{% endif %}>{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold text-white">Actualizar Donación</button>
            </form>
            <div class="mt-3 text-center">
                <a href="/historial" class="text-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
